<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cliquable</title>
    <style>
        /* Ici, on gère la dimension de l'image via le CSS */
        .image-redimensionnee {
            width: 600px;  /* Largeur de l'image */
            height: auto;   /* La hauteur s'ajuste pour garder les proportions */
            border: 2px solid #333; /* Optionnel : une petite bordure */
            transition: transform 0.3s; /* Petit effet au survol */
        }

        .image-redimensionnee:hover {
            transform: scale(1.05); /* L'image grossit légèrement au survol */
        }
    </style>
</head>
<body>

    <h1>Mon image cliquable</h1>
    <a href="https://photos.app.goo.gl/nYVEfT5NVkUZ9npy6" target="_blank">
        <img 
            src="https://steframq.github.io/Photos-aviron-1/DSC05366.JPG" 
            alt="Description de l'image" 
            class="image-redimensionnee"
        >
    </a>

    <p>Cliquez sur l'image pour être redirigé.</p>

</body>
</html>
